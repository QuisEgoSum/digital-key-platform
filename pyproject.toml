[project]
name = "digital-key-platform"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0,<1",
    "bcrypt>=5.0.0,<6",
    "httpx>=0.28.1,<0.29",
    "pydantic[email]>=2.12.5,<3",
    "python-dateutil>=2.9.0,<3",
    "PyYAML>=6.0.3,<7",
    "qstd-config>=1.0.2,<2",
    "redis>=7.2.0,<8",
    "sanic>=25.12.0,<26",
    "SQLAlchemy>=2.0.46,<3",
    "sqlalchemy-tx-context>=1.0.1,<2",
    "structlog>=25.5.0,<26",
    "opentelemetry-api>=1.39.1,<2",
    "opentelemetry-sdk>=1.39.1,<2",
    "orjson>=3.11.7,<4",
    "apscheduler>=3.11.2,<4",
    "alembic>=1.18.4,<2",
    "Mako>=1.3.10,<2",
    "jsonref>=1.1.0,<2",
]

[project.optional-dependencies]
dev = [
    "uv>=0.10.2,<0.11",
    "pre-commit>=4,<5",
    "mypy~=1.19.1",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.15.1,<0.16",
    "black>=26.1.0,<27",
    "psycopg>=3.3.3,<4",
    "sanic-testing",
    "types-PyYAML",
    "types-redis",
    "tabulate",
    "types-tabulate",
    "sqlparse",
    "asyncpg-stubs",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]
exclude = ["dist", ".venv"]
output-format = "concise"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "D",
    "B",
    "UP",
    "C4",
    "SIM",
    "TID",
    "T20",
    "ARG",
    "COM812",
    "RUF",
    "TCH",
]
ignore = [
    "E501",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "D105",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "T20",
  "ARG",
]
"src/scripts/**" = ["T20"]
"migrations/*" = ["D415"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-between-types = 1

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
mypy_path = ["src", "tests"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = false
exclude = "(?x)(.venv|venv|legacy|build|local)"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
[[tool.mypy.overrides]]
module = [
    "jsonref",
    "sanic_testing",
    "sanic_testing.testing",
]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
addopts = "-p no:warnings"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
