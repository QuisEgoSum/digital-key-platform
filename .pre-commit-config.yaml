repos:
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        args: ["--line-length=88", "--skip-string-normalization"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        name: mypy
        entry: mypy --config-file=./pyproject.toml
        language: system
        types: [python]
        files: .

  - repo: local
    hooks:
      - id: generate-env-list
        name: Generate ENV_LIST.md
        entry: bash scripts/hooks/generate_env_list_md.sh
        language: system
        pass_filenames: false
        always_run: true
